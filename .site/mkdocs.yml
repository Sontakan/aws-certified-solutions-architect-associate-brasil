site_name: AWS Solutions Architect Associate - Brasil
site_description: Trilha open-source em PT-BR para a certificação AWS SAA-C03
site_url: https://thiago-code-lab.github.io/aws-certified-solutions-architect-associate-brasil/
repo_url: https://github.com/Thiago-code-lab/aws-certified-solutions-architect-associate-brasil
repo_name: GitHub
docs_dir: ..

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

